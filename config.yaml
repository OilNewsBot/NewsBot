# Telegram channels for the shared market monitor. Use a username (default tier
# osint) or a mapping with channel and tier (official, tracker or osint).
telegram_channels: []
#  - channel: faytuks
#    tier: osint

# Telegram and TwitterAPI.io push can supply market events. Official X API
# polling has a separate daily read budget. Duplicate post IDs are coalesced.

x_push:
  enabled: true              # TwitterAPI.io push feed: set X_PUSH_API_KEY in .env
  url: wss://ws.twitterapi.io/twitter/tweet/websocket
  rule_tag: newsstream       # tag prefix for the vendor-side filter rules this app manages
  # The provider check interval affects delivery latency and request volume.
  interval_seconds: 10

x_api:
  enabled: false             # official X API FALLBACK: flip on (with X_BEARER_TOKEN) if the push vendor has an outage
  poll_interval_seconds: 60
  daily_read_budget: 5000    # hard stop; adapter pauses + UI banner when hit

# Market-monitor trade suggestions. Defaults live in config.jac; uncomment to
# override. Hard limits (1/3 of portfolio, 2-hour hold) are not configurable.
# trading:
#   enabled: true
#   contracts:               # contract used to size each ticker
#     WTI: {symbol: MCL, multiplier: 100, unit: bbl}
#     RBOB: {symbol: RB, multiplier: 42000, unit: gal}
#   hold_minutes: {transient: 15, uncertain: 60, moderate: 90, structural: 120}
#   aggressiveness: {low: 0.25, medium: 0.5, high: 1.0}

# Demo trade suggestions from db/demo_seed.json are inserted on startup when
# enabled. Disabling this setting preserves suggestions already stored.
demo:
  seed_suggestions: true

ui:
  max_stacked: 5
  stale_after_hours: 24

server:
  host: 127.0.0.1
  port: 8000
  db_path: ./data/newsstream.db

